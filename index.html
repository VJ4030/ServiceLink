
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiceLink - Trusted Local Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              // OVERRIDING DEFAULT PALETTES FOR LUXURY THEME
              stone: {
                50: '#FAFAFA',
                100: '#F5F5F5', // Main Text
                200: '#E5E5E5',
                300: '#D4D4D4',
                400: '#A3A3A3', // Secondary Text
                500: '#737373', // Muted
                600: '#525252',
                700: '#404040',
                800: '#262626', // Borders
                900: '#121212', // Card / Nav Background (Charcoal)
                950: '#050505', // Body Background (Deep Black)
              },
              amber: {
                50: '#FFFCF2',
                100: '#FFF7E0',
                200: '#FFEBB8',
                300: '#FFE08F',
                400: '#F5D76E', // Highlight Gold (Lighter)
                500: '#D4AF37', // PRIMARY GOLD (Metallic)
                600: '#C9A227', // Rich Gold (Darker/Deep)
                700: '#B8860B', // Dark Gold
                800: '#8F7524',
                900: '#3D3108', // Deep Gold Backgrounds
                950: '#241C03',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505; /* Deep Black */
        color: #F5F5F5; /* Main Text */
      }
      .glass-panel {
        background: rgba(18, 18, 18, 0.9); /* Charcoal with opacity */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(212, 175, 55, 0.15); /* Subtle Gold Border */
      }
      /* Custom Scrollbar - Luxury Style */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border: 1px solid #050505;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4AF37; /* Gold on hover */
      }
      
      /* Smooth fade in */
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* --- PREMIUM GOLD UTILITIES --- */
      
      /* 1. Metallic Text Gradient */
      .text-premium-gold {
        background: linear-gradient(to right, #C9A227, #F5D76E, #D4AF37, #C9A227);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        /* Subtle shine animation optional, keeping static for elegance */
      }

      /* 2. Metallic Background Gradient (Buttons/Icons) */
      .bg-premium-gold {
        background: linear-gradient(135deg, #C9A227 0%, #D4AF37 50%, #F5D76E 100%);
        transition: all 0.3s ease;
      }
      
      .bg-premium-gold:hover {
        background: linear-gradient(135deg, #D4AF37 0%, #F5D76E 50%, #FFE08F 100%);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.25); /* Premium soft glow */
        transform: translateY(-1px);
      }

      /* 3. Subtle Icon Glow (No background) */
      .icon-gold-glow {
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
      }
      
      /* 4. Card Selection Glow */
      .selection-gold::selection {
        background: rgba(212, 175, 55, 0.3);
        color: #fff;
      }

      /* 5. Button Shine Effect */
      .btn-shine {
        position: relative;
        overflow: hidden;
      }
      .btn-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }
      .btn-shine:hover::after {
        left: 100%;
      }

      /* 6. Soft Gold Pulse */
      @keyframes pulse-soft-gold {
        0%, 100% { box-shadow: 0 0 5px rgba(212, 175, 55, 0.1); border-color: rgba(212, 175, 55, 0.3); }
        50% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.25); border-color: rgba(212, 175, 55, 0.6); }
      }
      .animate-pulse-gold {
        animation: pulse-soft-gold 3s infinite ease-in-out;
      }

    </style>

{
  "imports": {

  }
}
</script>

</head>
